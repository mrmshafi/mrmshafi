<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Engr. Mamunur Rashid — personal GitHub studio</title>
<desc id="desc">Animated editorial burgundy and ivory banner with RASHID typography, pulsing orbital lines and flowing data signals.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#260a11"/><stop offset=".54" stop-color="#10070b"/><stop offset="1" stop-color="#080508"/></linearGradient>
 <linearGradient id="cream" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#fff3de"/><stop offset="1" stop-color="#d5aa8e"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#9e313b" stop-opacity=".84"/><stop offset=".54" stop-color="#7e202b" stop-opacity=".35"/><stop offset="1" stop-color="#8f2534" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#f2cbb6" stroke-opacity=".055" stroke-width="1" fill="none"/></pattern>
 <clipPath id="cl"><rect width="1200" height="400" rx="10"/></clipPath>
</defs>
<g clip-path="url(#cl)">
 <rect width="1200" height="400" fill="url(#back)"/>
 <rect width="1200" height="400" fill="url(#grid)"/>
 <circle cx="975" cy="206" r="290" fill="url(#aura)">
  <animate attributeName="opacity" values=".56;1;.56" dur="6s" repeatCount="indefinite"/>
 </circle>
 <circle cx="977" cy="200" r="164" fill="none" stroke="#e0a08b" stroke-opacity=".34" stroke-width="1"/>
 <circle cx="977" cy="200" r="135" fill="none" stroke="#edbda4" stroke-opacity=".16" stroke-width="1" stroke-dasharray="9 13">
  <animateTransform attributeName="transform" type="rotate" from="0 977 200" to="360 977 200" dur="55s" repeatCount="indefinite"/>
 </circle>
 <circle cx="977" cy="200" r="108" fill="none" stroke="#eab7a4" stroke-opacity=".25" stroke-width="1" stroke-dasharray="1 18">
  <animateTransform attributeName="transform" type="rotate" from="360 977 200" to="0 977 200" dur="36s" repeatCount="indefinite"/>
 </circle>
 <circle cx="977" cy="200" r="87" fill="#4d111b" fill-opacity=".32"/>
 <path d="M977 40V359M818 200H1137" stroke="#cf9589" stroke-opacity=".19"/>
 <path d="M35 35H1165V365H35Z" stroke="#debba3" stroke-opacity=".22" fill="none"/>
 <path d="M65 66H186 M65 331H186 M1026 331H1135" stroke="#d07367" stroke-width="2"/>
 <text x="65" y="92" font-family="Arial, Helvetica, sans-serif" letter-spacing="4" font-size="15" font-weight="700" fill="#d5aa97">PERSONAL ENGINEERING STUDIO   /   2026</text>
 <text x="65" y="172" font-family="Arial Narrow, Impact, Arial, sans-serif" font-size="61" font-stretch="condensed" letter-spacing="2" font-weight="900" fill="#f6dac0">ENGR. MAMUNUR</text>
 <text x="61" y="301" font-family="Georgia, 'Times New Roman', serif" font-size="120" letter-spacing="-5" fill="url(#cream)">RASHID<tspan fill="#bc665f">.</tspan></text>
 <text x="67" y="341" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3.1" font-weight="700" fill="#ddbcab">CODE   /   EXPERIMENT   /   BUILD</text>
 <text x="976" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="142" fill="#f5d9ba">M</text>
 <text x="975" y="331" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" letter-spacing="1" fill="#efc5ae">Build. Learn. Improve.</text>
 <path d="M65 111H650" stroke="#f1cbb1" stroke-opacity=".18"/>
 <path d="M65 111H195" stroke="#df8975" stroke-width="2">
  <animate attributeName="d" values="M65 111H126;M65 111H650;M65 111H126" dur="8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".5;1;.5" dur="8s" repeatCount="indefinite"/>
 </path>
 <g fill="#ee9d87">
  <circle cx="816" cy="200" r="4"><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1138" cy="200" r="3"><animate attributeName="opacity" values="1;.16;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="977" cy="36" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
 </g>
 <g fill="none" stroke="#d57e6c" stroke-opacity=".8"><path d="M845 270l14 0"><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/></path></g>
 <text x="1135" y="78" font-family="Arial, sans-serif" text-anchor="end" font-size="11" font-weight="700" letter-spacing="2" fill="#efc6ac">●  CURRENTLY BUILDING</text>
</g></svg>
